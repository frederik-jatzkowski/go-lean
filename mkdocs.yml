site_name: go-lean
repo_url: https://github.com/frederik-jatzkowski/go-lean
nav:
  - Home: README.md
  - Quickstart: docs/quickstart.md
  - Guides:
      - Writing modeled Go: docs/writing-go.md
      - Writing and checking proofs: docs/verification.md
  - Reference:
      - Supported Go: docs/supported-go.md
      - CLI and directives: docs/reference.md
  - Example walkthroughs:
      - Stack-machine compiler: examples/proven/stack_machine_compiler/README.md
      - Ten-pin bowling: examples/proven/bowling/README.md
      - Grid game: examples/proven/grid_game/README.md
      - Nine Men's Morris: examples/proven/nine_mens_morris/README.md
      - Clamp with an imported package: examples/proven/clamp_import/README.md
      - Assumed worker: examples/proven/assumed_worker/README.md
  - Project:
      - Contributing: CONTRIBUTING.md
      - Roadmap: docs/roadmap.md
      - License: license.md
theme:
  name: readthedocs
  navigation_depth: 3
  highlightjs: false
extra_css:
  - styles/code.css
plugins:
  - search
markdown_extensions:
  - fenced_code
  - codehilite:
      guess_lang: false
hooks:
  - scripts/docs_site.py
validation:
  links:
    anchors: warn
    unrecognized_links: warn
