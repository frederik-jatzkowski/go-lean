version: '3'

vars:
  GO: '{{.GO | default "go"}}'
  LAKE: '{{.LAKE | default "lake"}}'
  CLI: 'go-lean{{if eq OS "windows"}}.exe{{end}}'

tasks:
  default:
    cmds:
      - task: build

  build:
    desc: Build the Go CLI in the repository root
    cmds: ['{{.GO}} build -o {{.CLI}} ./cmd/go-lean']

  generate:
    desc: Regenerate Lean modules for the selected examples
    cmds: ['{{.GO}} run ./cmd/go-lean transpile ./...']

  test:
    desc: Run Go tests
    cmds: ['{{.GO}} test ./...']

  vet:
    desc: Run Go vet
    cmds: ['{{.GO}} vet ./...']

  fmt:
    desc: Format Go source
    cmds: ['{{.GO}} fmt ./...']

  prove:
    desc: Check the Lean proofs with Lake
    cmds: ['{{.GO}} run ./cmd/go-lean verify ./...']

  check:
    desc: Run the Go tests, vet, and Lean proofs
    cmds:
      - task: test
      - task: vet
      - task: prove

  clean:
    desc: Remove the CLI binary and Lake build artifacts
    cmds:
      - '{{.LAKE}} clean'
      - >-
          {{if eq OS "windows"}}
          powershell -NoProfile -Command
          "if (Test-Path -LiteralPath '{{.CLI}}' -PathType Leaf) {
          Remove-Item -LiteralPath '{{.CLI}}' -ErrorAction Stop }"
          {{else}}
          rm -f {{.CLI}}
          {{end}}
