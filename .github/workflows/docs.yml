name: Documentation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: python -m pip install -r requirements-docs.txt
      - run: python -m mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && vars.DEPLOY_DOCS_PAGES == 'true'
        with:
          path: site

  deploy:
    if: github.event_name == 'push' && vars.DEPLOY_DOCS_PAGES == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency: github-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify Pages visibility
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          public=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.public')
          if [[ "$public" != false && "$REPOSITORY_VISIBILITY" != public ]]; then
            echo "::error::This repository requires private Pages visibility."
            exit 1
          fi
      - uses: actions/deploy-pages@v4
        id: deployment
