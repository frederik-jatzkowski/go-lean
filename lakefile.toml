name = "goLean"
defaultTargets = ["ExampleProofs", "StackMachineCompiler", "CoreIR"]
moreLeanArgs = ["-DwarningAsError=true"]

[[lean_lib]]
name = "ExampleProofs"
srcDir = "examples/proven"
roots = [
  'bowling.bowling_rules',
  'nine_mens_morris.morris_rules',
  # BEGIN go-lean managed roots
  'assumed_worker.assumed_worker',
  'assumed_worker.assumed_worker_proofs',
  'assumed_worker.assumed_worker_verify',
  'bowling.model.bowling',
  'bowling.model.bowling_proofs',
  'bowling.model.bowling_verify',
  'clamp_import.clamp_import',
  'clamp_import.clamp_import_proofs',
  'clamp_import.clamp_import_verify',
  'clamp_import.limits.limits',
  'clamp_import.limits.limits_proofs',
  'clamp_import.limits.limits_verify',
  'grid_game.model.grid_game',
  'grid_game.model.grid_game_proofs',
  'grid_game.model.grid_game_verify',
  'nine_mens_morris.model.morris',
  'nine_mens_morris.model.morris_proofs',
  'nine_mens_morris.model.morris_verify',
  # END go-lean managed roots
]

[[lean_lib]]
name = "StackMachineCompiler"
srcDir = "examples/proven/stack_machine_compiler"
roots = [
  'spec',
  # BEGIN go-lean managed roots
  'model.compiler',
  'model.compiler_proofs',
  'model.compiler_verify',
  # END go-lean managed roots
]

[[lean_lib]]
name = "CoreIR"
srcDir = "internal/core"
roots = [
  'loaded.checked_type_termination',
  # BEGIN go-lean managed roots
  'ir.ir',
  'ir.ir_proofs',
  'ir.ir_verify',
  'loaded.loaded',
  'loaded.loaded_proofs',
  'loaded.loaded_verify',
  # END go-lean managed roots
]
